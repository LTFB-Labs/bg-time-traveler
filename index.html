<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Пътешествие във времето</title>
<meta name="description" content="Дърпай слайдъра и виж как се променя България от 600 г. до днес.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Kurale&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&display=swap">
<style>
:root{
  --sea:#c9d5c6;--sea-ink:#7f9a92;--paper:#f2e6c6;--paper2:#e9d9b0;--ink:#4a3520;--ink2:#6e5536;--muted:#8a7352;
  --gold:#d9a441;--gold2:#b9832a;--red:#c8402f;--card:#fbf4e2;--line:#d8c39a;
  --shadow:0 10px 30px rgba(60,40,15,.25),0 2px 6px rgba(60,40,15,.15);
  --font:'Nunito',system-ui,sans-serif;--title:'Kurale',Georgia,serif;--map:'Cormorant Garamond',Georgia,serif;
  --tl:118px;--cardw:min(390px,34vw);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--sea);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#grain{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;background-size:300px 300px}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(90,60,20,.28) 100%)}
.rlab{font-family:var(--map);font-weight:700;font-style:italic;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:rgba(242,230,198,.75);stroke-linejoin:round;pointer-events:none}
.rlab.bg{font-style:normal;letter-spacing:.18em;fill:#7a1e12}
.sea-lab{font-family:var(--map);font-style:italic;font-weight:600;fill:#4f6d66;text-anchor:middle;letter-spacing:.12em;opacity:.85}
.mt-lab{font-family:var(--map);font-style:italic;font-weight:700;fill:#7a6142;text-anchor:middle;letter-spacing:.2em;opacity:.8;paint-order:stroke;stroke:rgba(242,230,198,.7);stroke-width:3px}

/* overlay: cities and markers in screen space */
#ov{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.city{position:absolute;transform:translate(-4px,-50%);display:flex;align-items:center;gap:5px;white-space:nowrap;font-family:var(--map);font-weight:700;font-size:15px;color:#3d2a17;text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 6px var(--paper);transition:opacity .4s}
.city i{width:7px;height:7px;border-radius:50%;background:#3d2a17;box-shadow:0 0 0 2px var(--paper);flex:none}
.city.cap{font-size:17px;color:#7a1e12;font-family:var(--title)}
.city.cap i{width:auto;height:auto;background:none;box-shadow:none;font-style:normal;font-size:18px;line-height:1}
.city.cap span{transform:translateY(-1px)}
.mk{position:absolute;width:46px;height:46px;margin:-58px 0 0 -23px;border-radius:50%;pointer-events:auto;cursor:pointer;border:3px solid var(--gold);background:#f6ead0 center/cover no-repeat;box-shadow:0 3px 10px rgba(60,40,15,.35);transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .4s,border-color .3s;display:grid;place-items:center;padding:0}
.mk svg{width:24px;height:24px;color:#7a4f1a}
.mk::before{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-7px;border:7px solid transparent;border-top:9px solid var(--gold);border-bottom:0}
.mk.on::before{border-top-color:#fff}
.mk.has-img svg{display:none}
.mk:hover{transform:scale(1.12)}
.mk{transform-origin:50% calc(100% + 12px)}
.mk.on{transform:scale(1.4);border-color:#fff;z-index:5;box-shadow:0 0 0 3px var(--red),0 6px 18px rgba(60,40,15,.45)}
.mk.on::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--red);animation:ping 1.8s ease-out infinite}
.mk.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}}
@keyframes ping{from{opacity:.9;transform:scale(.8)}to{opacity:0;transform:scale(1.5)}}
.mk-lab{position:absolute;transform:translate(-50%,0);margin-top:8px;padding:3px 10px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:13px;white-space:nowrap;color:var(--ink);pointer-events:none;transition:opacity .3s}

/* HUD */
#hud{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));pointer-events:none;max-width:calc(100vw - 32px)}
#year{font-family:var(--title);font-size:clamp(52px,8vw,92px);line-height:.9;color:#5a2412;text-shadow:0 2px 0 var(--paper),0 0 18px var(--paper),0 0 30px var(--paper);letter-spacing:-.01em}
#year small{font-size:.32em;margin-left:.15em;letter-spacing:0}
#era{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:5px 12px 5px 10px;border-radius:999px;background:rgba(251,244,226,.92);box-shadow:var(--shadow);font-weight:900;font-size:15px}
#era i{width:12px;height:12px;border-radius:50%;flex:none}
#ruler{margin-top:6px;font-weight:700;font-size:14px;color:var(--ink2);background:rgba(251,244,226,.85);display:inline-block;padding:3px 10px;border-radius:999px;box-shadow:0 1px 4px rgba(60,40,15,.15)}
#ruler:empty{display:none}
#ruler b{font-weight:900;color:var(--ink)}
#hudBr{display:block;height:0}

/* card */
#card{position:fixed;right:16px;top:16px;bottom:calc(var(--tl) + 14px);width:var(--cardw);background:var(--card);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .3s}
#card .ph{position:relative;flex:none;aspect-ratio:4/3;max-height:42%;background:#e6d5ad;overflow:hidden}
#card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:fadein .6s ease}
#card .ph .cr{position:absolute;left:0;right:0;bottom:0;padding:14px 10px 5px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .ph .cr a{color:#fff}
#card .ph .noimg{position:absolute;inset:0;display:grid;place-items:center;color:#a27a3c;background:#e6d5ad;animation:fadein .6s ease}
#card .ph .noimg svg{width:30%;height:30%;opacity:.55}
#card .body{padding:16px 20px 10px;overflow:auto;flex:1;min-height:0}
#card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:900;font-size:12.5px;letter-spacing:.02em;background:#efe0bc;color:#6b4a1d}
.chip svg{width:15px;height:15px}
.chip.y{background:#7a1e12;color:#fff;font-family:var(--title);font-weight:400;font-size:15px;letter-spacing:0}
#card h2{font-family:var(--title);font-weight:400;font-size:clamp(22px,2.2vw,28px);line-height:1.1;margin:2px 0 10px;color:#3f230f}
#card p{margin:0;font-size:16.5px;line-height:1.5;font-weight:600;color:#4b3722}
#card .next{margin-top:14px;font-size:14px;color:var(--muted);font-weight:700}
#card .nav{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px dashed var(--line);flex:none}
.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:900;font-size:15px;background:#efe0bc;color:#5b3d17;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,background .2s}
.btn:hover{background:#e8d4a7}.btn:active{transform:scale(.96)}
.btn.pri{background:var(--red);color:#fff;flex:1}.btn.pri:hover{background:#b23525}
.btn svg{width:18px;height:18px}
@keyframes fadein{from{opacity:0}}
#card .x{display:none}

/* timeline */
#tl{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tl) + env(safe-area-inset-bottom));padding:10px max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(242,230,198,0) 0,rgba(242,230,198,.92) 22%,#efe1bd 100%);user-select:none;-webkit-user-select:none}
#play{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(122,30,18,.35);transition:transform .12s}
#play:active{transform:scale(.94)}
#play svg{width:24px;height:24px}
.step{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:#e5d1a4;color:#5b3d17;display:grid;place-items:center}
.step svg{width:20px;height:20px}
#track{position:relative;flex:1;height:84px;touch-action:none;cursor:pointer}
#bands{position:absolute;left:0;right:0;top:12px;height:26px;border-radius:13px;overflow:hidden;display:flex;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
#bands div{height:100%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11.5px;color:rgba(255,255,255,.95);white-space:nowrap;overflow:hidden;text-overflow:clip;border-right:1px solid rgba(255,255,255,.35);text-shadow:0 1px 1px rgba(0,0,0,.25);transition:filter .3s}
#bands div.cur{filter:saturate(1.25) brightness(1.06)}
#ticks{position:absolute;left:0;right:0;top:44px;height:30px}
#ticks span{position:absolute;transform:translateX(-50%);font-weight:800;font-size:11.5px;color:var(--muted);top:12px}
#ticks span::before{content:"";position:absolute;left:50%;top:-10px;width:1.5px;height:7px;background:#b59a6a}
#dots{position:absolute;left:0;right:0;top:38px;height:12px}
.dot{position:absolute;top:0;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:#7a1e12;border:2px solid #f5e7c7;border-radius:2px;cursor:pointer;transition:transform .2s,background .2s}
.dot:hover{transform:rotate(45deg) scale(1.5)}
.dot.seen{background:#c88f3a}
.dot.on{background:var(--red);transform:rotate(45deg) scale(1.6)}
#knob{position:absolute;top:-8px;width:0;height:92px;pointer-events:none}
#knob::before{content:"";position:absolute;left:-1.5px;top:20px;width:3px;height:60px;background:#5a2412;border-radius:2px}
#knob .head{position:absolute;left:-26px;top:-12px;width:52px;height:52px;border-radius:50%;background:#fff6dd;border:3px solid var(--gold);box-shadow:0 4px 10px rgba(60,40,15,.4);overflow:hidden;pointer-events:auto;cursor:grab}
#knob .head img{width:100%;height:100%;display:block}
#track.drag #knob .head{cursor:grabbing;transform:scale(1.08)}
#tip{position:absolute;bottom:100%;left:0;transform:translate(-50%,-6px);background:#3f230f;color:#fff;font-weight:800;font-size:13px;padding:5px 10px;border-radius:9px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
#tip.show{opacity:1}

/* migration arrows */
.mig{fill:none;stroke:#7a1e12;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14 10;animation:march 1.2s linear infinite;opacity:.9}
@keyframes march{to{stroke-dashoffset:-24}}

/* intro */
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;background:radial-gradient(ellipse at 50% 40%,#f8eed4 0,#efdfb6 60%,#e0c995 100%);transition:opacity .6s,transform .6s;text-align:center}
#intro.leave{opacity:0;transform:scale(1.05);pointer-events:none}
#intro .art{width:min(430px,78vw);max-height:52vh;aspect-ratio:1;animation:bob 3.2s ease-in-out infinite}
#intro .art svg,#intro .art img{width:100%;height:100%;display:block}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1deg)}}
#intro h1{font-family:var(--title);font-weight:400;font-size:clamp(34px,6vw,60px);margin:0;color:#5a2412;line-height:1;animation:rise .6s ease-out .3s both}
#intro p{margin:0;max-width:34ch;font-weight:700;font-size:clamp(16px,2vw,19px);color:var(--ink2);animation:rise .6s ease-out .5s both}
#intro .years{font-family:var(--title);font-size:22px;color:#7a1e12;animation:rise .6s ease-out .4s both}
#go{flex:none;margin-top:10px;font-size:20px;padding:14px 46px;border-radius:999px;animation:rise .6s ease-out .7s both,pulse 2s ease-in-out 1.6s infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(200,64,47,.18)}}

#card .more{display:none}
@media (max-width:760px){
  :root{--tl:104px}
  #card{left:10px;right:10px;width:auto;top:auto;bottom:calc(var(--tl) + env(safe-area-inset-bottom) + 6px);max-height:44vh;border-radius:18px}
  #card .ph{position:absolute;left:12px;top:12px;width:84px;height:84px;aspect-ratio:auto;border-radius:12px;max-height:none}
  #card .ph .cr{display:none}
  #card .body{padding:12px 14px 8px 108px;min-height:108px}
  #card h2{font-size:20px;margin-bottom:6px}
  #card p{font-size:15px;line-height:1.42}
  #card:not(.open) p,#card:not(.open) .next{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #card .nav{padding:8px 10px 10px}
  .btn{padding:9px 12px;font-size:14px}
  #card .more{display:inline-flex}
  #year{font-size:48px}
  #era{font-size:13px}
  #ruler{font-size:12.5px}
  .step{display:none}
  #play{width:48px;height:48px}
  #bands div{font-size:0}
  .mk{width:38px;height:38px;margin:-50px 0 0 -19px}
  .city{font-size:13px}.city.cap{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Карта на Балканите"></svg>
<div id="grain"></div>
<div id="vignette"></div>
<div id="ov"></div>

<div id="hud">
  <div id="year">600</div>
  <div id="era"><i></i><span></span></div><span id="hudBr"></span>
  <div id="ruler"></div>
</div>

<aside id="card" aria-live="polite">
  <div class="ph"></div>
  <div class="body"></div>
  <div class="nav">
    <button class="btn" id="prev" aria-label="Предишно събитие"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="btn more" id="more">Още</button>
    <button class="btn pri" id="next">Напред <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</aside>

<div id="tl">
  <button id="play" aria-label="Пусни"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
  <button class="step" id="sPrev" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="track">
    <div id="bands"></div>
    <div id="dots"></div>
    <div id="ticks"></div>
    <div id="knob"><div id="tip"></div><div class="head"><img src="traveler-head.svg" alt=""></div></div>
  </div>
  <button class="step" id="sNext" aria-label="Напред"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<div id="intro">
  <div class="art"><img src="traveler.svg" alt="Чудовището пътешественик във времето"></div>
  <h1>Пътешествие във времето</h1>
  <div class="years">600 — днес</div>
  <p>Хвани ме и ме дърпай по линията на времето! Ще видим как се ражда България, кой я управлява и как се менят границите ѝ.</p>
  <button class="btn pri" id="go">Тръгваме!</button>
</div>

<script src="geo.js"></script>
<script src="content.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
